<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Halaman tidak ditemukan di Banyuwangi Asyik Berita">
  <title>404 — Halaman Tidak Ditemukan | Banyuwangi Asyik Berita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <style>
    .error-page {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .error-page__code {
      font-family: var(--font-serif);
      font-size: 6rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-page__title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-dark);
      margin-bottom: 0.75rem;
    }
    .error-page__desc {
      font-size: 1rem;
      color: var(--color-text-muted);
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .error-page__btn {
      display: inline-block;
      background: var(--color-primary);
      color: #fff;
      padding: 0.875rem 2rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background var(--transition);
    }
    .error-page__btn:hover {
      background: var(--color-primary-dark);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-logo" aria-label="Banyuwangi Asyik Berita - Beranda">
        <img src="assets/logo.png" alt="Banyuwangi Asyik Berita Online" class="site-logo__img" width="200" height="68">
      </a>
    </div>
  </header>

  <main class="container">
    <div class="error-page">
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Halaman Tidak Ditemukan</h1>
      <p class="error-page__desc">
        Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan. Silakan kembali ke beranda untuk membaca berita terbaru dari Banyuwangi.
      </p>
      <a href="index.html" class="error-page__btn">Kembali ke Beranda</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__bottom">
        <span>&copy; 2026 Banyuwangi Asyik Berita. All rights reserved.</span>
        <span>banyuwangi-asyik.com</span>
      </div>
    </div>
  </footer>

</body>
</html>
